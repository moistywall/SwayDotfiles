theme = "red_alert"

[editor]
# line-number = "relative"
mouse = true
bufferline = "multiple"
color-modes = true
cursorline = true
auto-format = false
true-color = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.lsp]
display-messages = true

[editor.file-picker]
hidden = false

