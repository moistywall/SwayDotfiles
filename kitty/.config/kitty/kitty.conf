# ==================================
# Appearance
# ==================================

# 背景の透明度
background_opacity 0.9

# ウィンドウ内側の余白
window_padding_width 8
placement_strategy center


# ==================================
# Font
# ==================================

font_family HackGen Console
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0


# ==================================
# Scrolling
# ==================================

scrollback_lines 10000
wheel_scroll_multiplier 3.0


# ==================================
# Cursor
# ==================================

cursor_shape block
cursor_blink_interval 0
cursor_shape_unfocused hollow

# シェル統合によるカーソル形状の変更を防ぐ
shell_integration no-cursor


# ==================================
# Selection / Clipboard
# ==================================

# マウスで選択した文字列をクリップボードにコピー
copy_on_select no


# ==================================
# Primary Colors
# ==================================

background #800000
foreground #fffafa

cursor #b1063a
cursor_text_color #000000

selection_foreground #ffe4e1
selection_background #000000


# ==================================
# Normal Colors
# ==================================

color0  #3f3434
color1  #d64545
color2  #6f8f72
color3  #b88a3d
color4  #6c91a8
color5  #b05c7a
color6  #6e9ca0
color7  #f8f3ec


# ==================================
# Bright Colors
# ==================================

color8  #6b5d5d
color9  #e05252
color10 #7fae82
color11 #c99b4a
color12 #7ba8c4
color13 #c66f8e
color14 #7fb3b7
color15 #fffaf3

