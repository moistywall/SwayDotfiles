# キーバインド設定

## ターミナル呼び出し
unbindsym $mod+Return
bindsym $mod+Return exec alacritty

## ランダム画像 rofi 呼び出し
unbindsym $mod+d
bindsym $mod+d exec ~/.local/bin/rofi-random-image
bindsym $mod+Tab exec ~/.local/bin/rofi-random-image-for-window
bindsym $mod+c exec ~/.local/bin/rofi-for-command    # 画像未実装

## 音楽関連
bindsym $mod+m exec ~/.local/bin/music-toggle    # 再生、一時停止切り替え
bindsym $mod+Shift+m exec ~/.local/bin/music-stop    # 停止
bindsym $mod+Shift+v exec ~/.local/bin/app-volume-menu    # 音量変更

## 情報出力
bindsym $mod+i exec ~/.local/bin/info-panel-toggle
bindsym $mod+Shift+i exec ~/.local/bin/info-popup

### 情報出力の補助オプション
for_window [title="info-popup"] floating enable
for_window [title="info-popup"] border pixel 1
for_window [title="info-popup"] resize set 480 220
for_window [title="info-popup"] move absolute position 3300 70

for_window [title="info-panel-fixed"] floating enable
for_window [title="info-panel-fixed"] border pixel 1
for_window [title="info-panel-fixed"] resize set 520 240
for_window [title="info-panel-fixed"] move absolute position 3300 70

## 画面ロック
bindsym $mod+Shift+Escape exec loginctl lock-session
